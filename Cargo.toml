[package]
name = "wizardbot_engine"
version = "10.0.0"
edition = "2021"
authors = ["Merlin2LmmL"]
description = "WizardBot chess engine - Rust/WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
phf = { version = "0.11", features = ["macros"] }
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
rayon = { version = "1.8", optional = true }

[build-dependencies]
phf_codegen = "0.11"
serde_json = "1.0"

[features]
parallel-search = ["rayon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
[profile.dev]
panic = "unwind"
